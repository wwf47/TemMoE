# SpaMo residual temporal MoE on CSL-Daily (e16 k4, token routing, mT0-XL).
model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 3.0e-4
    monitor: val/bleu4
    model_name: bigscience/mt0-xl
    cache_dir: /path/to/hf_cache
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: false
    num_in_context: 0
    bleu_tokenizer: zh
    eval_do_sample: false
    use_temporal_moe: true
    temporal_use_shared_expert: true
    temporal_routing_granularity: token
    temporal_num_experts: 16
    temporal_top_k: 4
    temporal_moe_load_balance_type: cv2
    temporal_moe_aux_loss_weight: 0.05
    temporal_router_entropy_loss_weight: 0.0
    temporal_shared_mix_mode: residual
    temporal_shared_expert_gate_init: -2.0
    temporal_expert_dropout: 0.10
    temporal_moe_router_noise: 0.10
    temporal_router_temperature: 2.5
    temporal_router_z_loss_weight: 1.0e-3
    temporal_router_noise_anneal_frac: 0.33
    temporal_upcycle_noise: 0.0

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 2
    accelerator: gpu
    devices: 1
    max_epochs: 500
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16
  early_stopping:
    patience: 100
    min_delta: 0.05

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /path/to/preprocess/CSL-Daily
        vid_root: /path/to/csldaily/lmdb_videos
        feat_root: /path/to/spa_feat_csldaily
        mae_feat_root: /path/to/mo_feat_csldaily
        mode: train
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
        lang: Chinese
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /path/to/preprocess/CSL-Daily
        vid_root: /path/to/csldaily/lmdb_videos
        feat_root: /path/to/spa_feat_csldaily
        mae_feat_root: /path/to/mo_feat_csldaily
        mode: dev
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
        lang: Chinese
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /path/to/preprocess/CSL-Daily
        vid_root: /path/to/csldaily/lmdb_videos
        feat_root: /path/to/spa_feat_csldaily
        mae_feat_root: /path/to/mo_feat_csldaily
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
        lang: Chinese
